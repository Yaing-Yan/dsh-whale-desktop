<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta http-equiv="Content-Security-Policy"
  content="default-src 'self'; img-src 'self' data: blob:; media-src 'self' blob:; style-src 'self' 'unsafe-inline'; script-src 'self'; connect-src 'self'; font-src 'self' data:">
<title>DSH 小鲸鱼（桌面版）</title>
<style>
  html, body {
    margin: 0; padding: 0;
    width: 100%; height: 100%;
    background: transparent;
    overflow: hidden;
    /* 与浏览器版一致的字体栈（挂件模块里写死了 Microsoft YaHei 等字体） */
    font-family: system-ui, -apple-system, "Segoe UI", "Microsoft YaHei",
                 "PingFang SC", "Hiragino Sans GB", "Noto Sans CJK SC", sans-serif;
  }
  /* DSH 状态提示（启动自检用的小胶囊，正常后自动消失） */
  #dshw-desktop-status {
    position: fixed;
    left: 8px; top: 8px;
    max-width: calc(100vw - 16px);
    font: 12px/1.5 system-ui, "Microsoft YaHei", sans-serif;
    color: #203170;
    background: rgba(255,255,255,.94);
    border: 1px solid rgba(32,49,112,.3);
    border-radius: 8px;
    padding: 6px 10px;
    box-shadow: 0 2px 10px rgba(0,0,0,.18);
    pointer-events: none;
    opacity: 0;
    transition: opacity .4s ease;
    z-index: 30000;
    white-space: pre-wrap;
  }
  #dshw-desktop-status.show { opacity: 1; }
</style>
</head>
<body>
<div id="dshw-desktop-status"></div>
<script src="/loader.js"></script>
</body>
</html>
